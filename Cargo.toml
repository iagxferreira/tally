[package]
name = "tally"
description = "A double-entry financial ledger exploring correctness, consistency, and failure handling"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/iagoferreira/tally"

[dependencies]
# The domain's only dependency. uuid is a value-type library, not
# infrastructure: it brings no I/O, no runtime, and no framework, so it does
# not breach the rule that the domain stays free of infrastructure.
uuid = { version = "1", features = ["v7"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Principle 2: financial amounts must never use floating point.
# This makes the rule mechanical rather than cultural.
float_arithmetic = "deny"
# Silent wrapping / truncation is how ledgers lose money.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"

[profile.release]
# Rust wraps integer overflow in release builds by default. In a ledger a
# silently wrapped balance is the worst possible failure. Defense in depth:
# our arithmetic already returns Result, but if a raw `+` ever slips in we
# want a panic, not corrupt money.
overflow-checks = true
